version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: inventiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventiq
      POSTGRES_USER: inventiq
      POSTGRES_PASSWORD: inventiq2025
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inventiq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventiq -d inventiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO läuft bereits auf Synology (10.2.200.102:9000)
  # Auskommentiert da MinIO bereits extern läuft
  # minio:
  #   image: minio/minio:latest
  #   container_name: inventiq-minio
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: adm_maie
  #     MINIO_ROOT_PASSWORD: inventiq!2025
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data:/data
  #   networks:
  #     - inventiq-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 30s
  #     timeout: 20s
  #     retries: 3

  # Inventiq Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventiq-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # minio läuft extern auf Synology
    environment:
      # Database
      DATABASE_URL: postgresql://inventiq:inventiq2025@postgres:5432/inventiq
      
      # MinIO (extern auf Synology)
      S3_ENDPOINT: http://10.2.200.102:9000
      S3_BUCKET: inventiq-assets
      S3_REGION: us-east-1
      S3_ACCESS_KEY: adm_maie
      S3_SECRET_KEY: inventiq!2025
      S3_PUBLIC_URL: http://10.2.200.102:9000
      
      # App
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
      
      # AI (set your OpenAI key)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "3000:3000"
    networks:
      - inventiq-network
    volumes:
      # For development, mount source code
      - ./src:/app/src:ro
      - ./public:/app/public:ro

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inventiq-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inventiq.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - inventiq-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  # minio_data:  # Nicht benötigt - läuft auf Synology
  pgadmin_data:

networks:
  inventiq-network:
    driver: bridge